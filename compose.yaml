name: port-command

services:
  frontend:
    build: { context: ./frontend, target: development }
    init: true
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_PORT_COMMAND_MODE: ${NEXT_PUBLIC_PORT_COMMAND_MODE:-simulation}
      PORT_COMMAND_ALLOW_PRODUCTION_SIMULATION: ${PORT_COMMAND_ALLOW_PRODUCTION_SIMULATION:-false}
      BACKEND_API_ORIGIN: http://backend:8000
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [port_command_net]

  backend:
    build: ./backend
    init: true
    restart: unless-stopped
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -"]
    environment: &backend_env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: backend,localhost,127.0.0.1
      POSTGRES_DB: ${POSTGRES_DB:-port_command}
      POSTGRES_USER: ${POSTGRES_USER:-port_command_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgresql
      REDIS_URL: redis://redis:6379/0
    expose: ["8000"]
    depends_on:
      postgresql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 35s
    networks: [port_command_net]

  postgresql:
    image: postgres:18.6-alpine
    init: true
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-port_command}
      POSTGRES_USER: ${POSTGRES_USER:-port_command_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [port_command_net]

  redis:
    image: redis:8.10.3-alpine
    init: true
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [port_command_net]

  celery_worker:
    build: ./backend
    init: true
    restart: unless-stopped
    command: ["celery", "-A", "core", "worker", "--loglevel=info", "--concurrency=1"]
    environment: *backend_env
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A core inspect ping --timeout=3 | grep -q pong"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 35s
    networks: [port_command_net]

  celery_beat:
    build: ./backend
    init: true
    restart: unless-stopped
    command: ["celery", "-A", "core", "beat", "--loglevel=info", "--schedule=/var/lib/celery/celerybeat-schedule"]
    environment: *backend_env
    volumes: [celery_beat_data:/var/lib/celery]
    depends_on:
      backend: { condition: service_healthy }
    networks: [port_command_net]

  nginx:
    image: nginx:1.30.6-alpine
    init: true
    restart: unless-stopped
    ports: ["127.0.0.1:8088:80"]
    volumes: ["./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      frontend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [port_command_net]

  frontend_e2e:
    profiles: [test]
    build: { context: ./frontend, dockerfile: Dockerfile.e2e }
    init: true
    environment:
      PLAYWRIGHT_BASE_URL: http://nginx
    depends_on:
      nginx: { condition: service_healthy }
    networks: [port_command_net]

  frontend_build:
    profiles: [test]
    build: { context: ./frontend, target: development }
    init: true
    command: ["npm", "run", "build"]
    environment:
      NEXT_PUBLIC_PORT_COMMAND_MODE: ${NEXT_PUBLIC_PORT_COMMAND_MODE:-simulation}
      PORT_COMMAND_ALLOW_PRODUCTION_SIMULATION: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    networks: [port_command_net]

networks:
  port_command_net: {}
volumes:
  postgres_data: {}
  redis_data: {}
  frontend_node_modules: {}
  frontend_next: {}
  celery_beat_data: {}
